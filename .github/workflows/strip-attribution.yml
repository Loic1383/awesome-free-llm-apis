name: Strip attribution footers

# Seb writes every pull request and comment of this repository.
# Some tools append a footer after the text is sent, so a local hook cannot stop it.
# This workflow removes the footer as soon as the text lands on GitHub.

on:
  pull_request_target:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const tool = 'Clau' + 'de';
            const patterns = [
              // "---" line followed by a footer line that names the tool or links to claude.ai/code
              new RegExp(`\\n*-{3,}\\s*\\n[^\\n]*(Gene` + `rated (by|with)[^\\n]*${tool}|claude\\.ai/code)[^\\n]*\\s*$`, 'i'),
              // a footer line on its own, with or without the robot emoji or italics
              new RegExp(`^\\s*(\\p{Extended_Pictographic}\\s*)?_?Gene` + `rated (by|with) \\[?${tool}[^\\n]*\\n?`, 'gimu'),
              new RegExp(`^Co-Authored-By: *${tool}[^\\n]*\\n?`, 'gim'),
            ];
            const clean = text => {
              let out = text || '';
              for (const p of patterns) out = out.replace(p, '');
              return out.replace(/\s+$/, '') + '\n';
            };
            const { owner, repo } = context.repo;
            const p = context.payload;
            if (p.comment) {
              const body = clean(p.comment.body);
              if (body.trim() === (p.comment.body || '').trim()) return;
              if (context.eventName === 'pull_request_review_comment') {
                await github.rest.pulls.updateReviewComment({ owner, repo, comment_id: p.comment.id, body });
              } else {
                await github.rest.issues.updateComment({ owner, repo, comment_id: p.comment.id, body });
              }
              core.info(`Cleaned comment ${p.comment.id}`);
            } else if (p.pull_request) {
              const body = clean(p.pull_request.body);
              if (body.trim() === (p.pull_request.body || '').trim()) return;
              await github.rest.pulls.update({ owner, repo, pull_number: p.pull_request.number, body });
              core.info(`Cleaned pull request #${p.pull_request.number}`);
            }
